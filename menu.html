<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta charset="utf-8" />
  <title>Menu - Dough Not Disturb</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="desktop" data-model-id="1:2">
    <!-- Header / Navbar Section -->
    <img class="rectangle" src="https://c.animaapp.com/b8unGpd5/img/rectangle-1.svg" />
    <img class="logo" src="https://c.animaapp.com/b8unGpd5/img/logo@2x.png" />
    
    <!-- Navigation Links -->
    <a href="index.html"><div class="text-wrapper">HOME</div></a>
    <a href="menu.html"><div class="div">MENU</div></a>
    <a href="about.html"><div class="text-wrapper-2">ABOUT US</div></a>
    <a href="contact.html"><div class="text-wrapper-3">CONTACT</div></a>
    
    <!-- Order Now Button -->
    <a href="order.html">
      <div class="group-order">
        <div class="rectangle-2"></div>
        <div class="text-wrapper-4">ORDER NOW</div>
      </div>
    </a>

    <!-- Main Menu Container -->
    <div class="menu-container">
      <h1 class="menu-title">Our Fresh Daily Menu</h1>

      <div class="menu-grid">
        <!-- Item 1 -->
        <div class="menu-card">
          <div class="image-wrapper">
            <img src="https://c.animaapp.com/b8unGpd5/img/baked-raspberry-donuts-14-1@2x.png" alt="Raspberry Blast" />
          </div>
          <h3>Raspberry Blast</h3>
          <p>Tangy raspberry glaze topped with real berry bits.</p>
        </div>

        <!-- Item 2 -->
        <div class="menu-card">
          <div class="image-wrapper">
            <img src="https://c.animaapp.com/b8unGpd5/img/baked-raspberry-donuts-14-2@2x.png" alt="Zero Fudge Given" />
          </div>
          <h3>Zero Fudge Given</h3>
          <p>Triple-chocolate dough with a rich fudge glaze.</p>
        </div>

        <!-- Item 3 -->
        <div class="menu-card">
          <div class="image-wrapper">
            <img src="https://c.animaapp.com/b8unGpd5/img/baked-raspberry-donuts-14-3@2x.png" alt="Crème Brûlée" />
          </div>
          <h3>Crème Brûlée</h3>
          <p>Vanilla bean custard with a crunchy torched sugar crust.</p>
        </div>
      </div>
    </div>
  </div> 
</body>
</html>
